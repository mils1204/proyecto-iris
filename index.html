<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proyecto IRIS</title>
<style>
  :root { --bg: #0b1220; --card: #131c2e; --ink: #e8eefc; --dim: #93a1bd; --acc: #3fd4ff; --ok: #3fff7a; --bad: #ff5a4a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 4px 0 0; font-size: 22px; letter-spacing: 2px; }
  h1 span { color: var(--acc); }
  .sub { color: var(--dim); font-size: 13px; margin: 0; }
  .cam { position: relative; width: 100%; aspect-ratio: 3/4; background: #000; border-radius: 16px; overflow: hidden; }
  video, canvas.ov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .dir { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 6px 14px; border-radius: 20px; font-weight: 900; font-size: 18px; }
  .stage { position: absolute; inset: 0; pointer-events: none; }
  .target { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 6px rgba(63,212,255,.3), 0 0 24px var(--acc); transition: left .5s, top .5s; }
  .target.ok { background: var(--ok); box-shadow: 0 0 0 6px rgba(63,255,122,.3), 0 0 24px var(--ok); }
  .msg { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-weight: 800; font-size: 17px; text-shadow: 0 2px 4px #000; padding: 0 10px; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: 900; font-size: 15px; cursor: pointer; background: var(--acc); color: #04121a; }
  button.sec { background: var(--card); color: var(--ink); border: 1px solid #2a3a5a; }
  button:disabled { opacity: .45; }
  .panel { background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--dim); }
  .bars { display: grid; grid-template-columns: 90px 1fr 44px; gap: 4px 8px; align-items: center; }
  .bar { height: 8px; background: #22304d; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--acc); }
  .score { font-size: 15px; color: var(--ink); }
  .ball { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ffcc33 45%, #e08a00);
    box-shadow: 0 0 0 4px rgba(255,204,51,.35), 0 0 26px #ffcc33; }
  .cam.game video, .cam.game canvas.ov { opacity: .35; }
  /* Pantalla completa: calibración en los bordes del celular y modo páginas */
  .full { position: fixed; inset: 0; z-index: 50; background: var(--bg); }
  .full[hidden] { display: none; }
  .full .target { width: 40px; height: 40px; margin: -20px 0 0 -20px; }
  .full .fmsg { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); margin-top: 60px; text-align: center; font-weight: 800; font-size: 18px; padding: 0 20px; color: var(--dim); }
  .pager { overflow: hidden; }
  .track { position: absolute; inset: 0; transition: transform .6s cubic-bezier(.2,.8,.3,1); }
  .page { position: absolute; left: 0; right: 0; height: 100%; display: grid; place-items: center; font: 900 clamp(44px, 14vw, 90px)/1 system-ui, sans-serif; color: #fff; }
  .page { grid-template-rows: auto auto auto; align-content: center; gap: 18px; padding: 0 28px; text-align: center; }
  .page .em { font-size: clamp(70px, 22vw, 120px); }
  .page .tx { font: 700 clamp(20px, 6vw, 30px)/1.35 Georgia, serif; }
  .page .nm { font: 800 14px system-ui, sans-serif; letter-spacing: 2px; opacity: .7; }
  .hold { position: absolute; left: 50%; width: 60%; height: 10px; transform: translateX(-50%); background: rgba(255,255,255,.2); border-radius: 6px; overflow: hidden; z-index: 3; }
  .hold.up { top: 18px; } .hold.down { bottom: 18px; }
  .hold i { display: block; height: 100%; width: 0; background: #3fff7a; }
  .pexit { position: absolute; right: 14px; top: 40px; z-index: 4; flex: none; width: auto; padding: 10px 14px; background: rgba(0,0,0,.45); color: #fff; border: 1px solid rgba(255,255,255,.4); }
  .pinfo { position: absolute; left: 0; right: 0; bottom: 42px; text-align: center; z-index: 3; font-weight: 800; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
<main>
  <div><h1>PROYECTO <span>IRIS</span></h1><p class="sub">Prueba: detecta hacia dónde miras y valida ejercicios de ojos</p></div>
  <div class="cam">
    <video id="video" playsinline muted></video>
    <canvas id="ov" class="ov"></canvas>
    <div class="dir" id="dir">Cargando modelo…</div>
    <div class="stage" id="stage"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="row">
    <button id="btnStart">📷 Activar cámara</button>
  </div>
  <div class="row">
    <button id="btnCal" class="sec" disabled>🎯 Calibrar</button>
    <button id="btnEx" class="sec" disabled>👁 Ejercicio</button>
  </div>
  <div class="row">
    <button id="btnGame" class="sec" disabled>🎮 Juego: mueve el círculo con la mirada</button>
  </div>
  <div class="row">
    <button id="btnPages" class="sec" disabled>📖 Cuento: mira abajo para pasar página</button>
  </div>
  <div class="panel">
    <div class="bars" id="bars"></div>
  </div>
  <div class="panel score" id="score">Consejos: buena luz de frente, celular a 30–40 cm, cabeza quieta. Calibra primero.</div>
</main>
<div class="full" id="calFull" hidden><div class="fmsg" id="calMsg"></div></div>
<div class="full pager" id="pager" hidden>
  <div class="track" id="track"></div>
  <div class="hold up"><i id="holdUp"></i></div><div class="hold down"><i id="holdDown"></i></div>
  <button class="pexit" id="pexit">✕ Salir</button>
  <div class="pinfo" id="pinfo">Mira ARRIBA o ABAJO y mantén la mirada</div>
</div>
<script type="module">
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const $ = (id) => document.getElementById(id);
const video = $('video'), ov = $('ov'), ctx = ov.getContext('2d');
const DIRS = ['centro', 'izquierda', 'derecha', 'arriba', 'abajo'];
const LABEL = { centro: '● CENTRO', izquierda: '◀ IZQUIERDA', derecha: 'DERECHA ▶', arriba: '▲ ARRIBA', abajo: '▼ ABAJO', ninguno: '— sin rostro —' };
// Posición del punto en pantalla (en %), vista de espejo: "izquierda" = tu izquierda
const SPOT = { centro: [50, 50], izquierda: [12, 50], derecha: [88, 50], arriba: [50, 12], abajo: [50, 88] };

let landmarker = null, running = false, gaze = null, current = 'ninguno';
let calib = null;   // { dir: [h, v] } promedio de cada dirección

// ---------- Modelo ----------
async function loadModel() {
  const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await FaceLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' },
    runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true
  });
  $('dir').textContent = 'Listo · activa la cámara';
}
loadModel().catch((e) => { $('dir').textContent = 'Error al cargar el modelo'; console.error(e); });

// ---------- Cámara ----------
$('btnStart').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video.srcObject = stream; await video.play();
    $('btnStart').disabled = true; $('btnCal').disabled = false; $('btnEx').disabled = false; $('btnGame').disabled = false; $('btnPages').disabled = false;
    running = true; requestAnimationFrame(loop);
  } catch (e) { $('dir').textContent = 'Sin permiso de cámara'; }
});

// ---------- Mirada ----------
// Blendshapes de MediaPipe: eyeLookIn/Out/Up/Down de cada ojo (0..1). h > 0 = mira a SU izquierda; v > 0 = arriba.
function gazeFrom(bs) {
  const b = {}; bs.categories.forEach((c) => { b[c.categoryName] = c.score; });
  const h = ((b.eyeLookOutLeft + b.eyeLookInRight) - (b.eyeLookInLeft + b.eyeLookOutRight)) / 2;
  const v = ((b.eyeLookUpLeft + b.eyeLookUpRight) - (b.eyeLookDownLeft + b.eyeLookDownRight)) / 2;
  return { h, v, blink: (b.eyeBlinkLeft + b.eyeBlinkRight) / 2, b };
}
// Clasificar: con calibración, la dirección calibrada más cercana; sin ella, umbrales fijos
function classify(g) {
  if (!g) return 'ninguno';
  if (g.blink > 0.5) return 'parpadeo';
  if (calib) {
    let best = 'centro', bd = Infinity;
    for (const d of DIRS) { const [h, v] = calib[d]; const dist = (g.h - h) ** 2 + (g.v - v) ** 2; if (dist < bd) { bd = dist; best = d; } }
    return best;
  }
  if (g.h > 0.25) return 'izquierda'; if (g.h < -0.25) return 'derecha';
  if (g.v > 0.12) return 'arriba'; if (g.v < -0.2) return 'abajo';
  return 'centro';
}
// Ojos: contorno e iris (índices de Face Mesh; 468 y 473 = centro de cada iris)
const EYE_R = [33, 160, 158, 133, 153, 144], EYE_L = [362, 385, 387, 263, 373, 380];
function draw(lm) {
  ov.width = video.videoWidth; ov.height = video.videoHeight;
  ctx.clearRect(0, 0, ov.width, ov.height);
  if (!lm) return;
  const P = (i) => [lm[i].x * ov.width, lm[i].y * ov.height];
  ctx.strokeStyle = '#3fd4ff'; ctx.lineWidth = 2;
  for (const eye of [EYE_R, EYE_L]) { ctx.beginPath(); eye.forEach((i, k) => { const [x, y] = P(i); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke(); }
  ctx.fillStyle = '#3fff7a';
  for (const i of [468, 473]) { const [x, y] = P(i); ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); }
}
const SHOW = ['eyeLookInLeft', 'eyeLookOutLeft', 'eyeLookUpLeft', 'eyeLookDownLeft', 'eyeBlinkLeft'];
function bars(g) {
  $('bars').replaceChildren(...[['H (izq+/der−)', g ? g.h : 0], ['V (arr+/abj−)', g ? g.v : 0], ['Parpadeo', g ? g.blink : 0]].flatMap(([n, v]) => {
    const name = document.createElement('span'); name.textContent = n;
    const bar = document.createElement('div'); bar.className = 'bar'; const i = document.createElement('i'); i.style.width = `${Math.min(100, Math.abs(v) * 100)}%`; bar.append(i);
    const val = document.createElement('span'); val.textContent = v.toFixed(2);
    return [name, bar, val];
  }));
}
let lastT = -1;
function loop() {
  if (!running) return;
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    const r = landmarker.detectForVideo(video, performance.now());
    const lm = r.faceLandmarks?.[0], bs = r.faceBlendshapes?.[0];
    gaze = bs ? gazeFrom(bs) : null;
    current = lm ? classify(gaze) : 'ninguno';
    draw(lm); bars(gaze);
    $('dir').textContent = current === 'parpadeo' ? '😑 parpadeo' : LABEL[current];
  }
  requestAnimationFrame(loop);
}

// ---------- Calibración: mira cada punto 1.5 s ----------
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function showTarget(d) {
  const t = document.createElement('div'); t.className = 'target';
  const [x, y] = SPOT[d]; t.style.left = x + '%'; t.style.top = y + '%';
  $('stage').replaceChildren(t); return t;
}
async function sample(ms) {
  const xs = []; const end = performance.now() + ms;
  while (performance.now() < end) { if (gaze && gaze.blink < 0.5) xs.push([gaze.h, gaze.v]); await wait(40); }
  if (!xs.length) return null;
  return [xs.reduce((s, x) => s + x[0], 0) / xs.length, xs.reduce((s, x) => s + x[1], 0) / xs.length];
}
// Calibración a pantalla completa: los puntos van en los BORDES del celular (donde de verdad miras)
const EDGE = { centro: [50, 50], izquierda: [6, 50], derecha: [94, 50], arriba: [50, 5], abajo: [50, 95] };
$('btnCal').addEventListener('click', async () => {
  $('btnCal').disabled = $('btnEx').disabled = true;
  const full = $('calFull'); full.hidden = false;
  const c = {};
  for (const d of DIRS) {
    const t = document.createElement('div'); t.className = 'target';
    t.style.left = EDGE[d][0] + '%'; t.style.top = EDGE[d][1] + '%';
    full.replaceChildren(t, $('calMsg')); $('calMsg').textContent = `Mira el punto (${d}) sin mover la cabeza…`;
    await wait(900);
    c[d] = await sample(1500);
    if (!c[d]) { full.hidden = true; $('msg').textContent = 'No se vio tu cara. Intenta de nuevo con más luz.'; $('btnCal').disabled = $('btnEx').disabled = false; return; }
  }
  full.hidden = true;
  calib = c; $('stage').replaceChildren(); $('msg').textContent = '✅ Calibrado';
  $('score').textContent = 'Calibrado. Ahora toca 👁 Ejercicio.';
  $('btnCal').disabled = $('btnEx').disabled = false;
  setTimeout(() => { $('msg').textContent = ''; }, 1500);
});

// ---------- Cuento de 15 páginas: mirar ABAJO 0.7 s = siguiente, ARRIBA 0.7 s = anterior (los costados no cuentan) ----------
const HOLD_MS = 700;
const STORY = [
  ['✨', 'Lumi, la luciérnaga que perdió su luz'],
  ['🌙', 'En un bosque tranquilo vivía Lumi, una luciérnaga pequeña y curiosa.'],
  ['💡', 'Cada noche su luz brillaba para guiar a los animales perdidos.'],
  ['🌧️', 'Una noche de tormenta, una gota fría apagó su luz.'],
  ['😢', 'Lumi lloró: "¿Cómo ayudaré a mis amigos sin brillar?"'],
  ['🦉', 'El búho sabio le dijo: "La luz vuelve a quien la busca con valor."'],
  ['🌲', 'Lumi voló entre los árboles más altos, buscando una chispa.'],
  ['🐸', 'Encontró a una rana perdida que no sabía volver a su charca.'],
  ['🤝', 'Aunque estaba a oscuras, Lumi la acompañó cantando el camino.'],
  ['💧', 'Al llegar a la charca, la rana saltó feliz y le dio las gracias.'],
  ['🌟', 'Entonces, una chispa pequeñita se encendió en el cuerpo de Lumi.'],
  ['🐇', 'Luego ayudó a un conejito asustado, y su luz creció un poco más.'],
  ['🔥', 'Con cada amigo que ayudaba, Lumi brillaba con más fuerza.'],
  ['🌌', 'Al amanecer, su luz era la más hermosa de todo el bosque.'],
  ['💛', 'Lumi aprendió que su luz nace de ayudar a los demás. FIN'],
];
const COLORS = ['#1d3f8f', '#24306b', '#1f5a8a', '#3a3f55', '#4a2f5e', '#5a4313', '#1f5a3a', '#2f6b4a', '#2a5a6b', '#1d6f8f', '#6b5a13', '#5a3a6b', '#8f3a1d', '#3a1d6b', '#8f6a1d'];
$('track').replaceChildren(...STORY.map(([em, tx], i) => {
  const p = document.createElement('div'); p.className = 'page';
  p.style.top = (i * 100) + '%'; p.style.background = `linear-gradient(160deg, ${COLORS[i]}, #0b1220)`;
  const a = document.createElement('div'); a.className = 'em'; a.textContent = em;
  const b = document.createElement('div'); b.className = 'tx'; b.textContent = tx;
  const c = document.createElement('div'); c.className = 'nm'; c.textContent = `${i + 1} / ${STORY.length}`;
  p.append(a, b, c); return p;
}));
let pager = null;
function closePager() { if (!pager) return; cancelAnimationFrame(pager.raf); pager = null; $('pager').hidden = true; }
$('pexit').addEventListener('click', closePager);
$('btnPages').addEventListener('click', () => {
  $('pager').hidden = false;
  pager = { page: 1, dir: null, since: 0, raf: 0 };
  $('track').style.transform = 'translateY(0)';
  const tick = (now) => {
    if (!pager) return;
    const d = current === 'arriba' || current === 'abajo' ? current : null;
    if (d !== pager.dir) { pager.dir = d; pager.since = now; pager.locked = null; }
    if (pager.locked && d === pager.locked) { pager.raf = requestAnimationFrame(tick); return; }   // tras pasar página: mira al centro antes de pasar otra
    const want = d === 'arriba' ? pager.page - 1 : d === 'abajo' ? pager.page + 1 : 0;
    const pct = want >= 1 && want <= STORY.length ? Math.min(1, (now - pager.since) / HOLD_MS) : 0;
    $('holdUp').style.width = (d === 'arriba' ? pct * 100 : 0) + '%';
    $('holdDown').style.width = (d === 'abajo' ? pct * 100 : 0) + '%';
    if (pct >= 1) {
      pager.page = want; pager.locked = d; $('holdUp').style.width = $('holdDown').style.width = '0%';   // una página por mirada
      $('track').style.transform = `translateY(${-(want - 1) * 100}%)`;
      try { navigator.vibrate?.(40); } catch { /* sin vibración */ }
    }
    $('pinfo').textContent = !calib ? 'Tip: calibra primero para mejor respuesta' : '⬇ mira abajo: siguiente · ⬆ mira arriba: anterior';
    pager.raf = requestAnimationFrame(tick);
  };
  pager.raf = requestAnimationFrame(tick);
});

// ---------- Juego: el círculo avanza hacia donde miras; mirando al centro se detiene ----------
const STEP = { izquierda: [-1, 0], derecha: [1, 0], arriba: [0, -1], abajo: [0, 1] };
let game = null;
$('btnGame').addEventListener('click', () => {
  if (game) {   // segundo toque: salir del juego
    cancelAnimationFrame(game.raf); game = null;
    $('stage').replaceChildren(); $('msg').textContent = ''; document.querySelector('.cam').classList.remove('game');
    $('btnGame').textContent = '🎮 Juego: mueve el círculo con la mirada'; $('btnCal').disabled = $('btnEx').disabled = false;
    return;
  }
  const ball = document.createElement('div'); ball.className = 'ball';
  $('stage').replaceChildren(ball);
  document.querySelector('.cam').classList.add('game');
  $('btnGame').textContent = '⏹ Salir del juego'; $('btnCal').disabled = $('btnEx').disabled = true;
  $('msg').textContent = calib ? 'Mira hacia un lado para mover el círculo' : 'Tip: calibra primero para que responda mejor';
  game = { x: 50, y: 50, last: performance.now(), raf: 0 };
  const SPEED = 28;   // % de la pantalla por segundo
  const tick = (now) => {
    if (!game) return;
    const dt = Math.min(0.1, (now - game.last) / 1000); game.last = now;
    const s = STEP[current];
    if (s) { game.x = Math.max(4, Math.min(96, game.x + s[0] * SPEED * dt)); game.y = Math.max(4, Math.min(96, game.y + s[1] * SPEED * dt)); }
    ball.style.left = game.x + '%'; ball.style.top = game.y + '%';
    game.raf = requestAnimationFrame(tick);
  };
  game.raf = requestAnimationFrame(tick);
});

// ---------- Ejercicio: seguir el punto; cuenta como hecho si miras hacia ahí ≥ 60% del tiempo ----------
$('btnEx').addEventListener('click', async () => {
  $('btnCal').disabled = $('btnEx').disabled = true;
  const seq = ['izquierda', 'derecha', 'arriba', 'abajo', 'centro', 'derecha', 'izquierda', 'abajo', 'arriba', 'centro'];
  let ok = 0;
  for (let k = 0; k < seq.length; k++) {
    const d = seq[k], t = showTarget(d);
    $('msg').textContent = `${k + 1}/${seq.length} · mira ${d.toUpperCase()}`;
    await wait(700);   // tiempo para mover los ojos
    let hit = 0, n = 0; const end = performance.now() + 2000;
    while (performance.now() < end) { if (current !== 'parpadeo' && current !== 'ninguno') { n++; if (current === d) hit++; } await wait(40); }
    const good = n > 0 && hit / n >= 0.6;
    if (good) { ok++; t.classList.add('ok'); $('msg').textContent = '✅ ¡Bien!'; } else $('msg').textContent = '❌ No se detectó';
    await wait(500);
  }
  $('stage').replaceChildren();
  $('msg').textContent = `Resultado: ${ok}/${seq.length}`;
  $('score').textContent = `Ejercicio terminado: ${ok} de ${seq.length} movimientos validados (${Math.round(ok / seq.length * 100)}%).${calib ? '' : ' Tip: calibra primero para mejor precisión.'}`;
  $('btnCal').disabled = $('btnEx').disabled = false;
});
</script>
</body>
</html>
